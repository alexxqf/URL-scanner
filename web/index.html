<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Shield - Escáner de Seguridad</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.25rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .search-box {
            display: flex;
            gap: 0.75rem;
            background-color: var(--card-bg);
            padding: 0.75rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 1rem;
            padding: 0.5rem 0.75rem;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .search-box button:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
        }

        #resultados {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .status-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 1.15rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .grid-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .info-item {
            background-color: rgba(15, 23, 42, 0.6);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .info-item label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-item span {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .header-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .header-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            background-color: rgba(15, 23, 42, 0.4);
            border-left: 4px solid var(--border-color);
        }

        .header-item.present {
            border-left-color: var(--success-color);
        }

        .header-item.missing {
            border-left-color: var(--danger-color);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-right: 0.5rem;
        }

        .header-val {
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            word-break: break-all;
        }

        .header-desc {
            font-size: 0.825rem;
            color: var(--text-muted);
            line-height: 1.35;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.success { background-color: rgba(34, 197, 94, 0.2); color: var(--success-color); }
        .badge.danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger-color); }
        .badge.warning { background-color: rgba(245, 158, 11, 0.2); color: var(--warning-color); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🛡️ Header Shield</h1>
            <p>Análisis de cabeceras HTTP de seguridad y certificado SSL</p>
        </header>

        <div class="search-box">
            <input type="text" id="domainInput" placeholder="Ej: google.com">
            <button id="searchBtn" onclick="realizarEscaneo()">Escanear</button>
        </div>

        <div id="resultados">
            <div class="status-msg">Introduce un dominio para comenzar el análisis.</div>
        </div>
    </div>

    <script>
        // Diccionario de explicaciones con etiquetas HTML escapadas
        const headerInfo = {
            "Strict-Transport-Security": {
                desc: "Fuerza las conexiones mediante HTTPS cifrado, protegiendo contra ataques Man-in-the-Middle y ataques de downgrade."
            },
            "Content-Security-Policy": {
                desc: "Previene vulnerabilidades XSS y de inyección indicando qué recursos (scripts, imágenes, CSS) pueden cargarse."
            },
            "X-Frame-Options": {
                desc: "Protege contra ataques de Clickjacking impidiendo que la web sea embebida dentro de elementos &lt;iframe&gt; no autorizados."
            },
            "X-Content-Type-Options": {
                desc: "Evita que el navegador intente adivinar (MIME-sniffing) el tipo de archivo enviado, forzando la declaración estricta del Content-Type."
            },
            "Referrer-Policy": {
                desc: "Controla cuánta información sobre la procedencia de la navegación (URL remitente) se envía al pulsar enlaces hacia otros sitios."
            },
            "Permissions-Policy": {
                desc: "Restringe el acceso de la aplicación a características de hardware y navegador (cámara, micrófono, geolocalización, etc.)."
            }
        };

        function realizarEscaneo() {
            const input = document.getElementById('domainInput');
            const domain = input.value.trim();

            if (!domain) {
                alert('Por favor, introduce un dominio');
                return;
            }

            const contenedor = document.getElementById('resultados');
            contenedor.innerHTML = '<div class="status-msg">🔍 Analizando servidor y certificados... Por favor espera.</div>';

            fetch(`/api/scan?domain=${encodeURIComponent(domain)}`)
                .then(response => {
                    if (!response.ok) throw new Error('Error en el servidor');
                    return response.json();
                })
                .then(data => {
                    renderizarResultados(data);
                })
                .catch(err => {
                    console.error(err);
                    contenedor.innerHTML = '<div class="status-msg" style="color: var(--danger-color);">❌ Ocurrió un error al realizar el escaneo.</div>';
                });
        }

        function renderizarResultados(data) {
            const contenedor = document.getElementById('resultados');
            let html = '';

            // 1. Resumen general del Servidor y SSL
            const sslStatus = data.ssl && data.ssl.valid ? 
                '<span class="badge success">SSL Válido</span>' : 
                '<span class="badge danger">SSL Inválido / No Encontrado</span>';

            html += `
                <div class="card">
                    <div class="card-title">
                        <span>🌐 Resumen del Objetivo: <strong>${data.target || 'N/A'}</strong></span>
                        ${sslStatus}
                    </div>
                    <div class="grid-info">
                        <div class="info-item">
                            <label>Cabecera Server</label>
                            <span>${data.server_header || 'No divulgada (Recomendado)'}</span>
                        </div>
                        <div class="info-item">
                            <label>Emisor Certificado</label>
                            <span>${data.ssl ? (data.ssl.issuer || 'N/A') : 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <label>Días Restantes SSL</label>
                            <span>${data.ssl && data.ssl.days_remaining !== undefined ? data.ssl.days_remaining + ' días' : 'N/A'}</span>
                        </div>
                    </div>
                </div>
            `;

            // 2. Cabeceras HTTP de Seguridad
            html += `
                <div class="card">
                    <div class="card-title">
                        <span>🛡️ Cabeceras HTTP de Seguridad</span>
                    </div>
                    <div class="header-list">
            `;

            if (data.headers && Array.isArray(data.headers)) {
                data.headers.forEach(h => {
                    const isPresent = h.present;
                    const statusBadge = isPresent ? 
                        '<span class="badge success">Presente</span>' : 
                        '<span class="badge danger">Faltante</span>';
                    
                    const info = headerInfo[h.name] || { desc: "Cabecera de seguridad HTTP." };

                    html += `
                        <div class="header-item ${isPresent ? 'present' : 'missing'}">
                            <div class="header-top">
                                <div>
                                    <span class="header-name">${h.name}</span>
                                    ${statusBadge}
                                </div>
                                <div class="header-val">${isPresent ? (h.value || 'Configurada') : 'No implementada'}</div>
                            </div>
                            <div class="header-desc">
                                💡 <strong>Propósito:</strong> ${info.desc}
                            </div>
                        </div>
                    `;
                });
            } else {
                html += '<p style="color: var(--text-muted);">No se recibieron datos de cabeceras.</p>';
            }

            html += `
                    </div>
                </div>
            `;

            contenedor.innerHTML = html;
        }

        // Listener para la tecla Enter
        document.getElementById('domainInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                realizarEscaneo();
            }
        });
    </script>
</body>
</html>
